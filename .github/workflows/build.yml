name: Build Chopin kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out build wrapper
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            device-tree-compiler flex git libelf-dev libssl-dev \
            python3 rsync xz-utils

      # Only cache downloaded compiler files: never reuse kernel build outputs.
      - name: Cache Proton Clang toolchain
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: .work/proton-clang-13
          key: proton-clang-${{ runner.os }}-${{ hashFiles('SOURCE.lock') }}

      - name: Build kernel
        run: ./scripts/build.sh

      - name: Verify build outputs
        run: |
          set -euo pipefail
          ./scripts/verify-config.sh dist/kernel.config
          (
            cd dist
            sha256sum -c SHA256SUMS
            test -s Image
            test -s Image.gz
            test -s kernel.release
          )
          printf '### Chopin kernel build\nFUSE: enabled in verified kernel configuration.\nArtifacts are not flashable boot images.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chopin-build-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/build.log
            .work/out/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chopin-docker-kernel-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  release:
    name: Publish tagged kernel artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          name: chopin-docker-kernel-${{ github.sha }}
          path: dist/

      - name: Verify release checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          grep -qx 'CONFIG_FUSE_FS=y' dist/kernel.config

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/Image dist/Image.gz dist/Image.gz-dtb dist/chopin.dtb \
            dist/kernel.config dist/Module.symvers dist/kernel.release \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Chopin Docker kernel $RELEASE_TAG" \
            --notes "Raw ARM64 kernel artifacts only. NOT directly flashable. Repack with a tested boot image and keep a known-good recovery path. FUSE must be tested on the device."
